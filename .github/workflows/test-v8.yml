name: V8 tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'deps/v8/**'
      - 'tools/make-v8.sh'
      - 'tools/v8/**'
      - 'Makefile'
      - '.github/workflows/v8-tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'deps/v8/**'
      - 'tools/make-v8.sh'
      - 'tools/v8/**'
      - 'Makefile'
      - '.github/workflows/v8-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure
        run: ./configure
        
      - name: Bootstrap depot_tools
        run: |
          DT="$RUNNER_TEMP/depot_tools"
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DT"
          export PATH="$DT:$PATH"
          cd "$DT"
          "$DT/ensure_bootstrap"
          test -f "$DT/python3_bin_reldir.txt"
          ln -s "$DT" "$GITHUB_WORKSPACE/deps/v8/depot_tools"
          echo "$DT" >> "$GITHUB_PATH"
      
      - name: Build V8 and run its tests
        run: make test-v8 V8_EXTRA_TEST_OPTIONS="--variants=default --progress=ci"
